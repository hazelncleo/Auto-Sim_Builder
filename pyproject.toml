[project]
name = "auto-sim-builder"
version = "0.1.0"
requires-python = ">=3.13"
readme = "README.md"
description = "A CLI for organizing parameterized python scripts that interact with a multitude of simulation softwares - both commerical and OSS."
dependencies = [
    "pytest>=9.0.2",
    "readchar>=4.2.1",
    "textual>=7.5.0",
    "textual-dev>=1.8.0",
]

[project.scripts]
autosim = "auto_sim_builder.cli:main"

[build-system]
requires = ["uv_build>=0.10.10,<0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
